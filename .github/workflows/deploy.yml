name: Deploy to AWS App Runner

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build project
        run: npm run build
        env:
          # Database connection for Prisma
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          
          # The specific key your code (src/lib/encryption.ts) is looking for
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          
          # Required for Better-Auth
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          
          # URL for Inngest/Sentry telemetry
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          
          # Adding these as fallbacks in case other parts of the code use them
          CRYPTR_SECRET: ${{ secrets.ENCRYPTION_KEY }}
          ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_KEY }}

      # Once this build turns GREEN, your code is ready for App Runner!