name: Deploy to AWS App Runner

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build project
        run: npm run build
        env:
          # Database link for Prisma
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Required for Better-Auth & Cryptr encryption
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          # Required if your app uses Sentry or Inngest during build
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          # Use a placeholder if you don't have a real one yet
          CRYPTR_SECRET: ${{ secrets.BETTER_AUTH_SECRET }} 

      # Once the build above turns GREEN, we can add the 
      # AWS App Runner deployment step here.