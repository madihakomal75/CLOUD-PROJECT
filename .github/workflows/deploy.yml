deploy-lambda:
    name: Deploy Lambda
    runs-on: ubuntu-latest
    needs: deploy # Only deploy lambda if ECS succeeds
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Lambda Image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: nodebase-lambda-worker
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f Dockerfile.lambda .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # --- ADDED TERRAFORM STEP HERE ---
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -var="lambda_image_tag=${{ github.sha }}"
        env:
          # You must pass your AWS credentials and other required TF_VARs here
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_gh_client_id: ${{ secrets.GH_CLIENT_ID }}
          TF_VAR_gh_client_secret: ${{ secrets.GH_CLIENT_SECRET }}
          # Add any other variables your main.tf requires

      # --- REMAINDER OF YOUR CODE ---
      - name: Update Lambda Function Code
        run: |
          aws lambda update-function-code \
            --function-name nodebase-workflow-worker-v2 \
            --image-uri ${{ steps.login-ecr.outputs.registry }}/nodebase-lambda-worker:${{ github.sha }}

            