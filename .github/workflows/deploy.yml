name: Deploy to Amazon ECS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: nodebase-app
  ECS_SERVICE: nodebase-service
  ECS_CLUSTER: nodebase-cluster
  CONTAINER_NAME: nodebase-container

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: .aws/task-definition.json
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.build-image.outputs.image }}
    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true

  deploy-lambda:
    name: Deploy Lambda
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # Fixed typo from image_7fc77a.png
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Compile TypeScript
        run: npx tsc --project workers/tsconfig.json

      - name: Prune dev dependencies
        run: npm prune --production --legacy-peer-deps

      - name: Aggressive Cleanup
        run: |
          # Remove Prisma engines and caches to save ~100MB+
          rm -rf node_modules/@prisma/engines
          rm -rf node_modules/prisma
          rm -rf node_modules/.cache
          # Keep only the RHEL query engine needed for Lambda
          find node_modules/.prisma/client -name "libquery_engine-*" ! -name "libquery_engine-rhel-*" -delete
          # Delete non-runtime bloat
          rm -rf node_modules/@types
          rm -rf node_modules/typescript
          find node_modules -type f -name "*.md" -delete
          find node_modules -type f -name "*.map" -delete
          find node_modules -type f -name "*.ts" ! -path "*/node_modules/.prisma/*" -delete
          find node_modules -type d -name "test" -exec rm -rf {} + 2>/dev/null || true

      - name: Create deployment package
        run: |
          zip -r function.zip dist/ node_modules/ prisma/ \
            -x "*.git*" \
            -x "*node_modules/@prisma/engines*" \
            -x "*node_modules/typescript*" \
            -x "*node_modules/@types*"
          echo "Zip size: $(du -sh function.zip | cut -f1)"

      - name: Upload to S3
        run: |
          # Matches the bucket name cloud-project-26 from image_7fce9e.png
          aws s3 cp function.zip s3://${{ secrets.AWS_BUCKET_NAME }}/deployments/nodebase-worker-${{ github.sha }}.zip

      - name: Deploy to AWS Lambda via S3
        uses: appleboy/lambda-action@master
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_region: ${{ secrets.AWS_REGION }}
          function_name: nodebase-workflow-worker
          s3_bucket: ${{ secrets.AWS_BUCKET_NAME }}
          s3_key: deployments/nodebase-worker-${{ github.sha }}.zip